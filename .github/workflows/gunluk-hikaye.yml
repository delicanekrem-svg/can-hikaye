name: Günlük Instagram Hikayesi

on:
  # Yedek: GitHub'ın kendi zamanlayıcısı saatlerce gecikebilir. Erken gelirse görseli önceden hazırlar,
  # paylaşım penceresi içindeyse paylaşır, pencere dışındaysa paylaşmaz (gece paylaşım olmaz).
  # Asıl dakik tetikleme cron-job.org'dan (workflow_dispatch, bekle=true) gelir.
  schedule:
    - cron: "20 21 * * *"
    - cron: "20 3 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      tarih:
        description: "Tarih (YYYY-AA-GG). Boş = bugün"
        required: false
      yayinla:
        description: "Instagram'a da paylaşılsın mı?"
        type: boolean
        default: false
      bekle:
        description: "Paylaşım için 07:00'u beklesin mi? (dış zamanlayıcı için)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gunluk-hikaye
  cancel-in-progress: false

jobs:
  hikaye:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Tarihi belirle
        id: t
        run: |
          T="${{ github.event.inputs.tarih }}"
          if [ -z "$T" ]; then T=$(TZ=Europe/Istanbul date +%F); fi
          echo "tarih=$T" >> "$GITHUB_OUTPUT"

      - name: Görselleri üret
        env:
          # GEMINI_API_KEY (ücretsiz) ya da ANTHROPIC_API_KEY; ikisi de varsa Claude kullanılır
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "yayin/${{ steps.t.outputs.tarih }}/bilgi.json" ]; then
            echo "Bu günün görselleri zaten üretilmiş."
          else
            # Gemini yoğunsa ilk deneme başarısız olabilir: 10 dk bekleyip bir kez daha dene
            python gunluk.py uret --tarih "${{ steps.t.outputs.tarih }}" || \
              (echo "İlk deneme başarısız, 10 dk sonra tekrar denenecek"; sleep 600; \
               python gunluk.py uret --tarih "${{ steps.t.outputs.tarih }}")
          fi

      - name: Görselleri depoya kaydet (Instagram buradan çeker)
        run: |
          git config user.name "hikaye-bot"
          git config user.email "hikaye-bot@users.noreply.github.com"
          git add yayin/
          git diff --cached --quiet || git commit -m "Hikaye: ${{ steps.t.outputs.tarih }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 07:00'yi bekle
        if: github.event.inputs.bekle == 'true'
        run: |
          hedef=$(TZ=Europe/Istanbul date -d "${{ steps.t.outputs.tarih }} 07:00" +%s)
          simdi=$(date +%s)
          if [ "$hedef" -gt "$simdi" ]; then sleep $((hedef - simdi)); fi

      - name: Paylaşım penceresi
        id: p
        run: |
          s=$(TZ=Europe/Istanbul date +%H%M)
          if [ "$s" -ge 0700 ] && [ "$s" -le 1030 ]; then echo "icinde=true" >> "$GITHUB_OUTPUT"; else echo "icinde=false" >> "$GITHUB_OUTPUT"; fi
          echo "Türkiye saati $s, pencere 0700-1030"

      - name: Instagram'a paylaş
        if: github.event.inputs.yayinla == 'true' || (github.event_name == 'schedule' && steps.p.outputs.icinde == 'true')
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID_CANBASIMEVI: ${{ secrets.IG_ID_CANBASIMEVI }}
          IG_TOKEN_CANBASIMEVI: ${{ secrets.IG_TOKEN_CANBASIMEVI }}
          IG_ID_CANWEDDING: ${{ secrets.IG_ID_CANWEDDING }}
          IG_TOKEN_CANWEDDING: ${{ secrets.IG_TOKEN_CANWEDDING }}
        run: python gunluk.py yayinla --tarih "${{ steps.t.outputs.tarih }}"

      - name: Yayın kaydını kaydet
        if: always()
        run: |
          git add yayin/ || true
          git diff --cached --quiet || (git commit -m "Yayın kaydı: ${{ steps.t.outputs.tarih }}" && git pull --rebase && git push)
