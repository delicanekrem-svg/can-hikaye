<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak/fontlar.css">
<style>
/* Instagram hikaye ekranında üst ~220px ve alt ~240px arayüzle örtülür; önemli içerik arada kalır. */
body { background: var(--zemin); color: var(--yazi); font-family:"Metin",sans-serif; position:relative; }
.fon { position:absolute; inset:-60px; background:url("{{foto}}") center/cover; filter: blur(46px) saturate(.8); transform: scale(1.1); }
.ortu { position:absolute; inset:0; background: var(--zemin); opacity:.86; }
.doku { position:absolute; inset:0; opacity:.25;
  background-image: radial-gradient(rgba(127,127,127,.18) 1px, transparent 1px); background-size: 6px 6px; }
.icerik { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; }

.etiket { margin-top:236px; display:flex; align-items:center; gap:22px; font-size:24px; font-weight:600;
  letter-spacing:9px; color: var(--vurgu); }
.etiket i { width:60px; height:1px; background: var(--vurgu); opacity:.7; }

.cerceve { margin-top:40px; width:800px; height:1000px; padding:16px; background: var(--mat);
  border-radius: 6px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.55), 0 8px 24px -10px rgba(0,0,0,.35); }
.foto { width:100%; height:100%; border-radius: 2px; background:url("{{foto}}") center/cover; }

h1 { margin-top:56px; padding:0 110px; text-align:center; font-family:"Baslik",serif; font-style:italic; font-weight:500;
  font-size: {{baslik_px}}px; line-height:1.14; letter-spacing:-.4px; text-wrap: balance; }
.alt { margin-top:22px; display:flex; align-items:center; gap:18px; font-size:22px; font-weight:600; letter-spacing:5px;
  color: var(--yazi2); text-transform: uppercase; }
.alt::before, .alt::after { content:""; width:28px; height:1px; background: var(--soluk); }

.logo { margin-top:auto; margin-bottom:250px; height: var(--logo_h, 96px); max-width:560px;
  display:flex; align-items:center; justify-content:center; }
.logo img { height:100%; width:auto; max-width:100%; object-fit:contain; display:block; }
</style><style>{{tema_css}}</style></head><body>
<div class="fon"></div><div class="ortu"></div><div class="doku"></div>
<div class="icerik">
  <div class="etiket"><i></i>{{etiket}}<i></i></div>
  <div class="cerceve"><div class="foto"></div></div>
  <h1>{{baslik}}</h1>
  <div class="alt">{{aciklama}}</div>
  <div class="logo">{{logo}}</div>
</div>
</body></html>
