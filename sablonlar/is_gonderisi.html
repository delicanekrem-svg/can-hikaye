<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak/fontlar.css">
<style>
html, body { width:1080px; height:1350px; }
body { background: var(--zemin); color: var(--yazi); font-family:"Metin",sans-serif; display:flex; flex-direction:column; }
.foto { height: 930px; margin: 40px 40px 0; border-radius: 6px; background:url("{{foto}}") center/cover; }
.alt { flex:1; display:flex; align-items:center; justify-content:space-between; padding: 0 70px; gap: 40px; }
.metin { flex:1; min-width:0; }
.cizgi { width:56px; height:3px; background:var(--vurgu); margin-bottom:22px; }
h1 { font-family:"Baslik",serif; font-style:italic; font-weight:500; font-size:{{baslik_px}}px; line-height:1.15; letter-spacing:-.3px; }
p { text-wrap: balance; margin-top:14px; font-size:24px; letter-spacing:3px; text-transform:uppercase; color:var(--yazi2); font-weight:600; }
.logo { flex:none; max-width:400px; padding-left:36px; border-left:1px solid var(--soluk); height: var(--logo_h, 84px); }
</style><style>{{tema_css}}</style></head><body>
<div class="foto"></div>
<div class="alt">
  <div class="metin"><div class="cizgi"></div><h1>{{baslik}}</h1><p>{{aciklama}}</p></div>
  <div class="logo">{{logo}}</div>
</div>
</body></html>
